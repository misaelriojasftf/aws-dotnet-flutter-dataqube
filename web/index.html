<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cognito + S3 Fotos</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 760px;
        margin: 40px auto;
        padding: 0 16px;
        color: #1f2937;
      }

      h1 {
        margin-bottom: 8px;
      }

      .hint {
        margin-top: 0;
        color: #4b5563;
        font-size: 14px;
      }

      .card {
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 12px;
        background: #fff;
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      input,
      button {
        padding: 10px;
        box-sizing: border-box;
      }

      button {
        cursor: pointer;
      }

      #status {
        font-size: 14px;
        margin: 0;
      }

      #auth-only {
        display: none;
      }

      #photos-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .photo-item {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        overflow: hidden;
        background: #f9fafb;
      }

      .photo-item img {
        width: 100%;
        height: 120px;
        object-fit: cover;
        display: block;
      }

      .photo-item p {
        font-size: 12px;
        margin: 8px;
        word-break: break-all;
      }

      #message {
        color: #0f5132;
        font-size: 14px;
        min-height: 20px;
      }

      #error {
        color: #b91c1c;
        font-size: 14px;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Cognito OAuth + S3</h1>
    <p class="hint">Demo simple: login, subir foto y listar fotos del bucket.</p>

    <div class="card">
      <div class="row">
        <button id="login-btn" type="button">Login con Cognito</button>
        <button id="logout-btn" type="button">Logout</button>
      </div>
      <p id="status">Estado: revisando sesion...</p>
      <p id="message"></p>
      <p id="error"></p>
    </div>

    <div class="card" id="auth-only">
      <h3>Subir foto</h3>
      <div class="row">
        <input id="file-input" type="file" accept="image/*" />
        <button id="upload-btn" type="button">Subir foto</button>
        <button id="list-btn" type="button">Listar fotos</button>
      </div>
      <div id="photos-grid"></div>
    </div>

    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1692.0.min.js"></script>
    <script src="./cognito-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
