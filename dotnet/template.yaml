AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Adjustments Lambda HTTP API (.NET 8)

Parameters:
  Stage:
    Type: String
    Default: stg
    AllowedValues:
      - dev
      - prod
      - stg
    Description: Deployment stage
  DbSecretId:
    Type: String
    Default: rds/stockops/app
    Description: Secrets Manager secret id for the database config

Resources:
  AdjustmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "adjustments-lambda-${Stage}"
      Runtime: dotnet8
      MemorySize: 512
      Timeout: 10
      Handler: AdjustmentsLambda::AdjustmentsLambda.Function::FunctionHandler
      CodeUri: src/AdjustmentsLambda/
      AutoPublishAlias: !Ref Stage   # Automatically creates version and alias for the stage
      Environment:
        Variables:
          METRICS_NAMESPACE: StockOps
          STAGE: !Ref Stage
          DB_SECRET_ID: !Ref DbSecretId
      Policies:
        - CloudWatchPutMetricPolicy: {}
        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretId}*"
      Events:
        AdjustmentsPost:
          Type: HttpApi
          Properties:
            Path: /adjustments
            Method: POST
        AdjustmentsGetByStore:
          Type: HttpApi
          Properties:
            Path: /stores/{storeId}/adjustments
            Method: GET

Outputs:
  HttpApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  AdjustmentsFunctionArn:
    Description: Lambda ARN with alias for the stage
    Value: !GetAtt AdjustmentsFunction.Arn
