AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Adjustments Lambda HTTP API (.NET 8)

Parameters:
  Stage:
    Type: String
    Default: stg
    AllowedValues:
      - dev
      - prod
      - stg
    Description: Deployment stage
  DbHost:
    Type: String
    Description: RDS endpoint hostname
  DbName:
    Type: String
    Default: stockops
    Description: Database name
  DbUser:
    Type: String
    Default: admin
    Description: Database username
  DbPassword:
    Type: String
    NoEcho: true
    Description: Database password
  DbPort:
    Type: Number
    Default: 3306
    Description: Database port

Resources:
  AdjustmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "adjustments-lambda-${Stage}"
      Runtime: dotnet8
      MemorySize: 512
      Timeout: 10
      Handler: AdjustmentsLambda::AdjustmentsLambda.Function::FunctionHandler
      CodeUri: src/AdjustmentsLambda/
      AutoPublishAlias: !Ref Stage   # Automatically creates version and alias for the stage
      Environment:
        Variables:
          METRICS_NAMESPACE: StockOps
          DB_HOST: !Ref DbHost
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          DB_PORT: !Ref DbPort
      Policies:
        - CloudWatchPutMetricPolicy: {}
      Events:
        AdjustmentsPost:
          Type: HttpApi
          Properties:
            Path: /adjustments
            Method: POST
        AdjustmentsGetByStore:
          Type: HttpApi
          Properties:
            Path: /stores/{storeId}/adjustments
            Method: GET

Outputs:
  HttpApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  AdjustmentsFunctionArn:
    Description: Lambda ARN with alias for the stage
    Value: !GetAtt AdjustmentsFunction.Arn
